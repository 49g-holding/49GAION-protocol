# The one set of checks of the Library repositories (the mother repositories of the parts and the
# assemblies), as a composite action each of them runs at a pinned commit of this repository:
#
#   jobs:
#     cards:            # or pins, in an assembly
#       runs-on: ubuntu-latest
#       steps:
#         - uses: actions/checkout@v4
#           with: { fetch-depth: 0 }
#         - uses: 49g-holding/49GAION-protocol/.github/actions/library-checks@<commit>
#           with: { check: cards }
#     ... one job per check: pin, cards | pins, no-persian, no-org-names, no-binaries, dr-frozen
#
# The caller's jobs keep the names its ruleset requires (cards or pins, no-persian, no-org-names).
# One pin: every `uses:` line of the caller that names this action must equal the caller's
# PROTOCOL-PIN; the `pin` check fails if they differ, so a Library repository moves its pin in one
# place and by one pull request. Every check reads this repository at that pin, never at main.
#
# Checks:
#   pin           every uses line of this action equals PROTOCOL-PIN
#   cards         cards/ is exactly what tools/make_cards.py generates from the blueprint, and
#                 validates against spec/schemas at the pin (mother repositories)
#   pins          tools/check_pins.py reads every pin of the assembly back (assemblies)
#   no-persian    no Persian or Arabic-script character in any tracked file, the PR title or body
#   no-org-names  the scanner of this repository at the pin finds no organisation name, host or code
#   no-binaries   no binary file is added or changed (the caller checks out with fetch-depth 0)
#   dr-frozen     a decision record on the base is never changed; a new one takes a new number
#
# Structure review of 26 October 2026, points D3 and D4; 49GAION/DR-0047.
name: library-checks
description: The checks of a 49GAION Library repository, at the Protocol pin
inputs:
  check:
    description: "pin | cards | pins | no-persian | no-org-names | no-binaries | dr-frozen"
    required: true
runs:
  using: composite
  steps:
    - name: Read the Protocol pin
      id: pin
      shell: bash
      run: |
        PIN=$(tr -d ' \n\r' < PROTOCOL-PIN)
        if ! printf '%s' "$PIN" | grep -Eq '^[0-9a-f]{40}$'; then echo "::error::PROTOCOL-PIN must hold one full commit SHA of 49GAION-protocol"; exit 1; fi
        echo "sha=$PIN" >> "$GITHUB_OUTPUT"

    - name: Every uses line of this action equals PROTOCOL-PIN
      if: inputs.check == 'pin'
      shell: bash
      env:
        PIN: ${{ steps.pin.outputs.sha }}
      run: |
        USES=$(grep -rhoE 'uses:[[:space:]]*49g-holding/49GAION-protocol/\.github/actions/library-checks@[0-9a-f]{40}' .github/workflows/ | sed -E 's/.*@//' | sort -u)
        if [ -z "$USES" ]; then echo "::error::PIN-UNREADABLE: no workflow of this repository uses library-checks at a full commit SHA."; exit 1; fi
        if [ "$(printf '%s\n' "$USES" | wc -l)" -ne 1 ] || [ "$USES" != "$PIN" ]; then echo "::error::PIN-MISMATCH: PROTOCOL-PIN is $PIN but library-checks is used at: $USES. Move both in one pull request."; exit 1; fi
        echo "pin $PIN"

    - name: Check out 49GAION-protocol at the pin
      if: inputs.check == 'cards' || inputs.check == 'no-org-names'
      uses: actions/checkout@v4
      with:
        repository: 49g-holding/49GAION-protocol
        ref: ${{ steps.pin.outputs.sha }}
        path: .deps/protocol

    - name: Python
      if: inputs.check == 'cards' || inputs.check == 'pins'
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Generate and check the cards
      if: inputs.check == 'cards'
      shell: bash
      run: |
        pip install pyyaml==6.0.2 jsonschema==4.23.0 referencing==0.35.1
        python3 tools/make_cards.py .deps/protocol/spec/schemas
        git diff --exit-code -- cards

    - name: Read every pin back
      if: inputs.check == 'pins'
      shell: bash
      run: python3 tools/check_pins.py

    - name: Scan tracked files, the PR title and the PR body
      if: inputs.check == 'no-persian'
      shell: bash
      env:
        PR_TITLE: ${{ github.event.pull_request.title }}
        PR_BODY: ${{ github.event.pull_request.body }}
      run: |
        python3 - <<'PY'
        import os, re, subprocess, sys
        pat = re.compile('[\u0600-\u06FF\uFB50-\uFDFF\uFE70-\uFEFF]')
        hits = []
        for f in subprocess.run(['git', 'ls-files'], capture_output=True, text=True, check=True).stdout.splitlines():
            try:
                text = open(f, encoding='utf-8').read()
            except (UnicodeDecodeError, IsADirectoryError, FileNotFoundError):
                continue
            hits += [f'{f}:{n}' for n, line in enumerate(text.splitlines(), 1) if pat.search(line)]
        for name in ('PR_TITLE', 'PR_BODY'):
            if pat.search(os.environ.get(name, '')):
                hits.append(name)
        for h in hits:
            print(f'::error::Persian characters: {h}')
        sys.exit(1 if hits else 0)
        PY

    - name: Scan tracked files for organisation names
      if: inputs.check == 'no-org-names'
      shell: bash
      run: |
        hits=$(bash .deps/protocol/.github/scripts/no-org-names.sh | grep -v '^\.deps/' || true)
        if [ -n "$hits" ]; then
          echo "$hits"
          echo "::error::Organisation names, hosts or 49-prefixed codes found (listed above)."
          exit 1
        fi

    - name: No binary file is added or changed
      if: inputs.check == 'no-binaries'
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=$(git rev-parse HEAD~1); fi
        BAD=""
        while IFS= read -r f; do
          [ -n "$f" ] && [ -f "$f" ] || continue
          case "$f" in *.svg) continue;; esac
          if [ -s "$f" ] && ! python3 -c 'import sys; d=open(sys.argv[1],"rb").read(); sys.exit(1 if b"\0" in d else 0)' "$f" 2>/dev/null; then BAD="$BAD$f"$'\n'; continue; fi
          if [ -s "$f" ] && ! python3 -c 'import sys; open(sys.argv[1],"rb").read().decode("utf-8")' "$f" 2>/dev/null; then BAD="$BAD$f"$'\n'; fi
        done < <(git diff --name-only --diff-filter=AM "$BASE"...HEAD)
        if [ -n "$BAD" ]; then printf '%s' "$BAD"; echo "::error::Binary files added or changed (listed above). Keep them outside the repository, cited by link and SHA-256."; exit 1; fi
        echo "No binary files added or changed."

    - name: A decision record on the base never changes
      if: inputs.check == 'dr-frozen'
      shell: bash
      env:
        BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=$(git rev-parse HEAD~1); fi
        BAD=""
        while IFS= read -r f; do
          [ -n "$f" ] || continue
          case "$f" in decisions/DR-[0-9][0-9][0-9][0-9]*.md) ;; *) continue;; esac
          if git cat-file -e "$BASE:$f" 2>/dev/null; then BAD="$BAD$f"$'\n'; fi
        done < <(git diff --name-only --diff-filter=MDR "$BASE"...HEAD)
        if [ -n "$BAD" ]; then printf '%s' "$BAD"; echo "::error::DR-FROZEN: a decision record on the base was changed, renamed or deleted (listed above). A correction is a new record with the next number."; exit 1; fi
        echo "No decision record on the base was changed."
