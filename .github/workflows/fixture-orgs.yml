# Required check on main. Runs the reference
# organisations under tests/orgs/ (tests/orgs/check_orgs.py): every card validates against
# the unit card schema and every organisation passes the delivery test lines D-1 to D-4
# that can be checked from its register; each must-fail organisation fails on the rule it names.
# A missing or empty tests/orgs/ fails (FIXTURE-ORGS-MISSING); check_orgs.py also requires each of
# the four reference organisations and the D-4 cycle case (FIXTURE-ORGS-REFERENCE-MISSING).
name: fixture-orgs
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fixture-orgs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema==4.23.0 referencing==0.35.1
      - name: Run the reference organisations
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [ ! -f tests/orgs/check_orgs.py ] || [ -z "$(find tests/orgs -mindepth 2 -name register.json -size +2c 2>/dev/null)" ]; then
            if [ -n "$BASE" ] && git cat-file -e "$BASE:tests/orgs/check_orgs.py" 2>/dev/null; then
              echo "::error::FIXTURE-ORGS-REMOVED: tests/orgs/ is on the base branch and missing here."; exit 1
            fi
            echo "::error::FIXTURE-ORGS-MISSING: tests/orgs/ is missing or holds no register."; exit 1
          fi
          python3 tests/orgs/check_orgs.py
