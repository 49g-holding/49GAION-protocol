# no-persian (DR-0052): no character of the Arabic script in any tracked file or file name, in the
# pull request's title, body or branch name, or in the messages, names and e-mail addresses of the
# commits new to the change. Every text in GitHub is English; translations are marked "translated
# from Persian". Earlier commits stay as history. The script is the copy on the base branch
# (trusted code); only the change that first adds it runs its own copy.
# Required check on main in the three 49GAION repositories.
name: no-persian

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-persian:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan files, names, the pull request and its new commits
        env:
          TRUSTED: ${{ github.event.pull_request.base.sha || github.sha }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          f=.github/scripts/no_persian.py
          mkdir -p "$RUNNER_TEMP/trusted"
          if git cat-file -e "$TRUSTED:$f" 2>/dev/null; then
            git show "$TRUSTED:$f" > "$RUNNER_TEMP/trusted/no_persian.py"
          else
            echo "::warning::$f is not on the base branch yet. This .github/-only pull request introduces it, so its own copy runs this once."
            cp "$f" "$RUNNER_TEMP/trusted/no_persian.py"
          fi
          python3 "$RUNNER_TEMP/trusted/no_persian.py"
