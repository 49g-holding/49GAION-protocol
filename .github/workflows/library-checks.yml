# The one checks workflow of the Library repositories (the mother repositories of the parts and
# the assemblies), called by each of them at a pinned commit of this repository:
#
#   jobs:
#     checks:
#       uses: 49g-holding/49GAION-protocol/.github/workflows/library-checks.yml@<commit>
#       with: { kind: mother }        # or: assembly
#
# One pin: the commit in the caller's `uses:` line must equal the caller's PROTOCOL-PIN file, and
# the first job fails if they differ, so a Library repository moves its pin in one place and by
# one pull request. Every check reads this repository at that pin, never at main.
#
# Jobs (the check names the callers' rulesets require):
#   checks / pin           the pin of the workflow equals PROTOCOL-PIN
#   checks / cards         kind mother:   cards/ is exactly what tools/make_cards.py generates from the
#                          blueprint, and validates against spec/schemas at the pin
#   checks / pins          kind assembly: tools/check_pins.py reads every pin of the assembly back
#   checks / no-persian    no Persian or Arabic-script character in any tracked file, the PR title or body
#   checks / no-org-names  the scanner of this repository at the pin finds no organisation name, host or code
#   checks / no-binaries   no binary file is added or changed
#   checks / dr-frozen     a decision record on the base is never changed; a new one takes a new number
#
# Structure review of 26 October 2026, points D3 and D4; 49GAION/DR-0047.
name: library-checks

on:
  workflow_call:
    inputs:
      kind:
        description: "mother (cards) or assembly (pins)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The workflow's pin equals PROTOCOL-PIN
        shell: bash
        env:
          WORKFLOW_SHA: ${{ github.job_workflow_sha }}
        run: |
          PIN=$(tr -d ' \n\r' < PROTOCOL-PIN)
          if ! printf '%s' "$PIN" | grep -Eq '^[0-9a-f]{40}$'; then echo "::error::PROTOCOL-PIN must hold one full commit SHA of 49GAION-protocol"; exit 1; fi
          if [ "$PIN" != "$WORKFLOW_SHA" ]; then echo "::error::PIN-MISMATCH: PROTOCOL-PIN is $PIN but this workflow is called at $WORKFLOW_SHA. Move both in one pull request."; exit 1; fi
          echo "pin $PIN"

  cards:
    if: inputs.kind == 'mother'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the Protocol pin
        id: pin
        run: echo "sha=$(tr -d ' \n\r' < PROTOCOL-PIN)" >> "$GITHUB_OUTPUT"
      - name: Check out the schemas of 49GAION-protocol at the pin
        uses: actions/checkout@v4
        with:
          repository: 49g-holding/49GAION-protocol
          ref: ${{ steps.pin.outputs.sha }}
          path: .deps/protocol
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2 jsonschema==4.23.0 referencing==0.35.1
      - name: Generate and check the cards
        run: python3 tools/make_cards.py .deps/protocol/spec/schemas
      - name: The committed cards are the generated cards
        run: git diff --exit-code -- cards

  pins:
    if: inputs.kind == 'assembly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read every pin back
        run: python3 tools/check_pins.py

  no-persian:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan tracked files, the PR title and the PR body
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess, sys
          pat = re.compile('[؀-ۿﭐ-﷿ﹰ-﻿]')
          hits = []
          for f in subprocess.run(['git', 'ls-files'], capture_output=True, text=True, check=True).stdout.splitlines():
              try:
                  text = open(f, encoding='utf-8').read()
              except (UnicodeDecodeError, IsADirectoryError, FileNotFoundError):
                  continue
              hits += [f'{f}:{n}' for n, line in enumerate(text.splitlines(), 1) if pat.search(line)]
          for name in ('PR_TITLE', 'PR_BODY'):
              if pat.search(os.environ.get(name, '')):
                  hits.append(name)
          for h in hits:
              print(f'::error::Persian characters: {h}')
          sys.exit(1 if hits else 0)
          PY

  no-org-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the Protocol pin
        id: pin
        run: echo "sha=$(tr -d ' \n\r' < PROTOCOL-PIN)" >> "$GITHUB_OUTPUT"
      - name: Check out the scanner of 49GAION-protocol at the pin
        uses: actions/checkout@v4
        with:
          repository: 49g-holding/49GAION-protocol
          ref: ${{ steps.pin.outputs.sha }}
          path: .deps/protocol
      - name: Scan tracked files
        run: |
          hits=$(bash .deps/protocol/.github/scripts/no-org-names.sh | grep -v '^\.deps/' || true)
          if [ -n "$hits" ]; then
            echo "$hits"
            echo "::error::Organisation names, hosts or 49-prefixed codes found (listed above)."
            exit 1
          fi

  no-binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: No binary file is added or changed
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=$(git rev-parse HEAD~1); fi
          BAD=""
          while IFS= read -r f; do
            [ -n "$f" ] && [ -f "$f" ] || continue
            case "$f" in *.svg) continue;; esac
            if [ -s "$f" ] && ! python3 -c 'import sys; d=open(sys.argv[1],"rb").read(); sys.exit(1 if b"\0" in d else 0)' "$f" 2>/dev/null; then BAD="$BAD$f"$'\n'; continue; fi
            if [ -s "$f" ] && ! python3 -c 'import sys; open(sys.argv[1],"rb").read().decode("utf-8")' "$f" 2>/dev/null; then BAD="$BAD$f"$'\n'; fi
          done < <(git diff --name-only --diff-filter=AM "$BASE"...HEAD)
          if [ -n "$BAD" ]; then printf '%s' "$BAD"; echo "::error::Binary files added or changed (listed above). Keep them outside the repository, cited by link and SHA-256."; exit 1; fi
          echo "No binary files added or changed."

  dr-frozen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: A decision record on the base never changes
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=$(git rev-parse HEAD~1); fi
          BAD=""
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in decisions/DR-[0-9][0-9][0-9][0-9]*.md) ;; *) continue;; esac
            if git cat-file -e "$BASE:$f" 2>/dev/null; then BAD="$BAD$f"$'\n'; fi
          done < <(git diff --name-only --diff-filter=MDR "$BASE"...HEAD)
          if [ -n "$BAD" ]; then printf '%s' "$BAD"; echo "::error::DR-FROZEN: a decision record on the base was changed, renamed or deleted (listed above). A correction is a new record with the next number."; exit 1; fi
          echo "No decision record on the base was changed."
