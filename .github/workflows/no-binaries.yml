# Required check on main. Fails a change that adds or changes a binary file anywhere in the
# repository (no path filter: a required check never has one). Binaries (PDF, images,
# compressed bundles, office files) are kept outside the repository, cited by link and
# SHA-256 in the reference list. SVG is text and passes.
# On a pull request the base is its base commit; on a push to main, the commit before the push.
name: no-binaries

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  no-binaries:
    runs-on: ubuntu-latest
    steps:
      - name: Check out with full log
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan added or changed files
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then BASE=$(git rev-parse HEAD~1); fi
          BAD=""
          while IFS= read -r f; do
            [ -n "$f" ] && [ -f "$f" ] || continue
            case "$f" in *.svg) continue;; esac   # SVG is text
            # Binary: contains a NUL byte or is not valid UTF-8 (catches files grep -I reads as text).
            if [ -s "$f" ] && ! python3 -c 'import sys; d=open(sys.argv[1],"rb").read(); sys.exit(1 if b"\0" in d else 0); ' "$f" 2>/dev/null; then BAD="$BAD$f"$'\n'; continue; fi
            if [ -s "$f" ] && ! python3 -c 'import sys; open(sys.argv[1],"rb").read().decode("utf-8")' "$f" 2>/dev/null; then BAD="$BAD$f"$'\n'; fi
          done < <(git diff --name-only --diff-filter=AM "$BASE"...HEAD)
          if [ -n "$BAD" ]; then
            printf '%s' "$BAD"
            echo "::error::NO-BINARIES: binary files added or changed (listed above). Keep them outside the repository and cite link + SHA-256 in the reference list."
            exit 1
          fi
          echo "No binary files added or changed."
