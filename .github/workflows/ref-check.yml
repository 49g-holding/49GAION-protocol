# Required check on main. On a pull request it checks the files the pull request
# changes; on main, every file. Every reference to a decision record (DR-####), a section
# (§N.N), a Naming Standard rule (R#), a Human Floor item (HF-##) or a delivery test
# line (D-#) must exist; references to decision IDs that exist nowhere fail.
# Every relative link in a tracked Markdown file resolves, outside the lists of superseded
# wording (check_links.py, DR-0052).
# The companion repositories are read at main, or at the ref in the repository
# variables HUB_REF / PROTOCOL_REF / AIOC_REF when set and still present.
name: ref-check
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ref-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch companion repositories
        run: |
          bash .github/scripts/fetch.sh 49GAION .deps/hub "${{ vars.HUB_REF }}"
          bash .github/scripts/fetch.sh 49GAION-aioc .deps/aioc "${{ vars.AIOC_REF }}"
      - name: Check references
        env:
          HUB_DIR: .deps/hub
          PROTOCOL_DIR: .
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AIOC_DIR: .deps/aioc
        run: python3 .github/scripts/check_refs.py
      - name: Every relative link resolves (DR-0052)
        run: python3 .github/scripts/check_links.py
