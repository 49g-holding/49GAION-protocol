# Fixed test for AIOC cards: every schema is valid JSON Schema; a
# complete card passes; an incomplete card is rejected. Not a required check.
name: card-schema-test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  card-schema-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema referencing
      - run: python tests/cards/check_cards.py
